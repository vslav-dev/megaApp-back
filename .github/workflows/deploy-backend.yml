name: Deploy Backend

on:
  workflow_call:
    inputs:
      server-path:
        required: true
        type: string
        description: 'Server runtime path'
      service-name:
        required: true
        type: string
        description: 'Systemd service name'
      commit_sha:
        required: false
        type: string
        description: 'Specific commit SHA to deploy'
      build-tags:
        required: false
        type: string
        default: ''
        description: 'Go build tags, e.g. swagger for the test build'
    secrets:
      HOST:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: VPS_31
    concurrency:
      group: deploy-${{ inputs.service-name }}
      cancel-in-progress: true

    steps:
      - name: Check out selected commit
        if: ${{ inputs.commit_sha != '' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Check out workflow commit
        if: ${{ inputs.commit_sha == '' }}
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Both variants are always tested: the swagger one holds the spec-vs-routes check, the plain
      # one holds the check that the prod build has no documentation routes.
      - name: Run Go tests
        run: |
          set -eu
          go test ./...
          go test -tags swagger ./...

      - name: Resolve build info
        run: |
          set -eu
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(TZ=UTC git show -s --format=%cd --date=format-local:'%d.%m.%Y, %H:%M:%S' HEAD)" >> "$GITHUB_ENV"

      - name: Build deploy package
        run: |
          set -eu
          rm -rf deploy
          mkdir -p deploy
          GOOS=linux GOARCH=amd64 go build -trimpath -tags "${{ inputs.build-tags }}" -o deploy/megaapp-server ./cmd/server
          cp -a migrations deploy/migrations
          printf '{"commit":"%s","time":"%s"}' "$COMMIT_SHA" "$BUILD_TIME" > deploy/build-info.json
          tar -C deploy -czf deploy/megaapp-server.tar.gz megaapp-server migrations build-info.json

      - name: Upload deploy package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/megaapp-server.tar.gz
          target: ${{ inputs.server-path }}
          overwrite: true

      - name: Activate deploy package
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            install -d -m 755 ${{ inputs.server-path }}
            cd ${{ inputs.server-path }}
            rm -f megaapp-server build-info.json
            rm -rf migrations
            tar -xzf deploy/megaapp-server.tar.gz
            rm -f deploy/megaapp-server.tar.gz
            rmdir --ignore-fail-on-non-empty deploy || true
            chmod 755 megaapp-server
            systemctl daemon-reload
            systemctl restart ${{ inputs.service-name }}
            systemctl is-active --quiet ${{ inputs.service-name }}
